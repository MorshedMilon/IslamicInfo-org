# ═══════════════════════════════════════════════════════════
# IslamicInfo.org — API Proxy Worker
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# ═══════════════════════════════════════════════════════════
name = "islamicinfo-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Once islamicinfo.org DNS is on Cloudflare, uncomment to serve
# from api.islamicinfo.org instead of *.workers.dev:
# routes = [
#   { pattern = "api.islamicinfo.org", custom_domain = true }
# ]

[[kv_namespaces]]
binding = "QURANLYAI_KV"
id = "3a39753a664948b097149eb09c02e3bc"

# Hadith Library source (public base URL only; HADITH_API_KEY is a Worker secret,
# set via `npx wrangler secret put HADITH_API_KEY`, never committed).
[vars]
HADITH_API_BASE_URL = "https://hadithapi.com"
