# ═══════════════════════════════════════════════════════════
# IslamicInfo.org — API Proxy Worker
# Deploy:  npx wrangler deploy
# Dev:     npx wrangler dev
# ═══════════════════════════════════════════════════════════
name = "islamicinfo-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Once islamicinfo.org DNS is on Cloudflare, uncomment to serve
# from api.islamicinfo.org instead of *.workers.dev:
# routes = [
#   { pattern = "api.islamicinfo.org", custom_domain = true }
# ]

[[kv_namespaces]]
binding = "QURANLYAI_KV"
id = "3a39753a664948b097149eb09c02e3bc"

# Itqan narrator-reliability D1 (ADR-046/047). Uncomment + fill database_id after:
#   wrangler d1 create rijal
# Then apply the schema + ingested data (see worker/scripts/ingest-itqan.mjs).
# Until this binding exists, /api/narrator/:id returns { matched:false } (feature dark).
# [[d1_databases]]
# binding = "DB_RIJAL"
# database_name = "rijal"
# database_id = "<paste-id-from-wrangler-d1-create>"

# Hadith Library source (public base URL only; HADITH_API_KEY is a Worker secret,
# set via `npx wrangler secret put HADITH_API_KEY`, never committed).
[vars]
HADITH_API_BASE_URL = "https://hadithapi.com"

# Silsila as-Sahiha Dorar.net search (see doc/DECISIONS.md ADR + doc/API-SPEC.md
# GET /api/hadith/dorar/search). Default OFF pending owner review of Dorar's
# terms/attribution + a Worker-reachability check (dorar.net may 403 bots).
HADITH_SILSILA_DORAR_ENABLED = "true"

# Dua search (GET /api/dua/search). Default OFF as of 2026-07-31: the search
# scans all 556 corpus records with no exclusion, so Gate 1 not-a-dua entries
# are returned as dua results. Flip to "true" only after the corpus-level
# exclusion ships AND the owner re-approves. See doc/DUA-CONTENT-INTEGRITY-v1_0.md.
DUA_SEARCH_ENABLED = "false"
